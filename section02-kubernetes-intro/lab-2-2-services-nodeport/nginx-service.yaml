# ── Pod ─────────────────────────────────────────
apiVersion: v1
kind: Pod
metadata:
  name: mi-nginx
  labels:
    app: mi-nginx
spec:
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
---
# ── Service ─────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: mi-nginx-svc
spec:
  selector:
    app: mi-nginx
  type: NodePort
  ports:
    - port: 80        # puerto del Service dentro del cluster
      targetPort: 80  # puerto del container nginx
      nodePort: 30090 # puerto accesible desde tu máquina
