apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: lab2-6-api:1.0
          imagePullPolicy: Never   # usa la imagen local (no busca en Docker Hub)
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
---
# Service ClusterIP — solo accesible DENTRO del clúster
# El frontend (nginx) usa este nombre DNS: http://api-svc:3000
apiVersion: v1
kind: Service
metadata:
  name: api-svc
spec:
  selector:
    app: api
  type: ClusterIP      # no expone nada fuera del clúster
  ports:
    - port: 3000
      targetPort: 3000
