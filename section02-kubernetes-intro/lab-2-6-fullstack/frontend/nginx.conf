server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain application/javascript text/css application/json;

    # Proxy hacia el Service interno de la API (ClusterIP)
    # Mismo patrón que Docker Compose — solo cambia el nombre del destino:
    #   Docker Compose → proxy_pass http://api:3000      (nombre del servicio)
    #   Kubernetes     → proxy_pass http://api-svc:3000  (nombre del Service ClusterIP)
    location /api/ {
        proxy_pass         http://api-svc:3000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # SPA routing — todas las rutas del frontend van a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
