apiVersion: v1
kind: Service
metadata:
  name: products-api-svc
  namespace: labs
spec:
  selector:
    app: products-api
  ports:
    - protocol: TCP
      port: 80          # Puerto del Service (visible para otros pods en el cluster)
      targetPort: 8080  # Puerto del container Spring Boot
  type: NodePort        # Para acceder desde fuera con minikube o Docker Desktop
