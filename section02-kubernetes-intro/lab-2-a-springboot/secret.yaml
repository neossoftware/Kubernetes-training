apiVersion: v1
kind: Secret
metadata:
  name: pg-secret
  namespace: labs
type: Opaque
stringData:
  # stringData permite texto plano; K8s lo convierte a base64 automáticamente
  # IMPORTANTE: en producción nunca guardes secrets en texto plano en git.
  # Usa Sealed Secrets, External Secrets Operator o HashiCorp Vault.
  POSTGRES_USER: appuser
  POSTGRES_PASSWORD: secret123
  POSTGRES_DB: productsdb
