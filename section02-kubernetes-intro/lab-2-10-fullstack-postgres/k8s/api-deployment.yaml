apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: lab2-10
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: lab2-10-api:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: DB_HOST
              value: "postgres-svc"      # K8s DNS resuelve al ClusterIP de postgres-svc
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
---
# ClusterIP — el API solo es accesible desde nginx (frontend Pod)
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: lab2-10
spec:
  selector:
    app: api
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
