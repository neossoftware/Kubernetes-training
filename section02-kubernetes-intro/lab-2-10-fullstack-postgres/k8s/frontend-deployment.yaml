apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: lab2-10
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: lab2-10-frontend:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
# NodePort — accesible desde el browser en localhost:30094
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: lab2-10
spec:
  selector:
    app: frontend
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30094
