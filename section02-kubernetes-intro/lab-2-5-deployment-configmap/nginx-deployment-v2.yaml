apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deploy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-deploy
  template:
    metadata:
      labels:
        app: nginx-deploy
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html-vol
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html-vol
          configMap:
            name: nginx-html    # apunta al ConfigMap
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-deploy-svc
spec:
  selector:
    app: nginx-deploy
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30091
