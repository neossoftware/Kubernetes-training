# ── Pod ─────────────────────────────────────────
apiVersion: v1
kind: Pod
metadata:
  name: hello-pod
  namespace: hello
  labels:
    app: hello
spec:
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
      volumeMounts:
        - name: html-vol
          mountPath: /usr/share/nginx/html
  volumes:
    - name: html-vol
      configMap:
        name: hello-html
---
# ── Service ─────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: hello-svc
  namespace: hello
spec:
  selector:
    app: hello
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
