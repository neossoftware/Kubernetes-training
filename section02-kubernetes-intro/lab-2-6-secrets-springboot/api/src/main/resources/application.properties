spring.application.name=products-api

# DataSource — valores inyectados desde Kubernetes Secret (db-secret)
# Sin defaults: si el Secret no está montado, la app falla al arrancar
# y el Pod queda en CrashLoopBackOff — señal clara de que falta configuración
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Datos iniciales — ejecuta data.sql después de que Hibernate crea las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
