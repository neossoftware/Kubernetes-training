# ── Deployment ──────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deploy
spec:
  replicas: 3                # queremos 3 pods corriendo siempre
  selector:
    matchLabels:
      app: nginx-deploy      # el Deployment gestiona Pods con este label
  template:                  # plantilla para crear cada Pod
    metadata:
      labels:
        app: nginx-deploy
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
# ── Service ─────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: nginx-deploy-svc
spec:
  selector:
    app: nginx-deploy
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30091
