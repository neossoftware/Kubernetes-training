apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-html
  namespace: hello
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="utf-8">
      <title>Hello Kubernetes!</title>
      <style>
        body { font-family: sans-serif; display: flex; align-items: center;
               justify-content: center; min-height: 100vh; margin: 0;
               background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .card { background: white; padding: 40px 60px; border-radius: 16px;
                text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
        h1 { color: #1e293b; font-size: 2.5rem; margin: 0 0 12px; }
        p  { color: #64748b; font-size: 1.1rem; margin: 0; }
        .badge { background: #3b82f6; color: white; padding: 4px 14px;
                 border-radius: 20px; font-size: .9rem; margin-top: 16px;
                 display: inline-block; }
      </style>
    </head>
    <body>
      <div class="card">
        <h1>☸ Hello from Kubernetes!</h1>
        <p>Tu primer Pod corriendo en el cluster.</p>
        <div class="badge">nginx · Lab 2-0</div>
      </div>
    </body>
    </html>
