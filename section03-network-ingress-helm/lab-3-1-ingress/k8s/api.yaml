apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: lab3-1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: node:20-alpine
          command: ["node", "-e"]
          args:
            - |
              const http = require('http');
              const os = require('os');
              http.createServer((req, res) => {
                res.setHeader('Content-Type', 'application/json');
                res.setHeader('Access-Control-Allow-Origin', '*');
                res.end(JSON.stringify({
                  message: 'API Lab 3-1 - Ingress routing demo',
                  hostname: os.hostname(),
                  path: req.url,
                  timestamp: new Date().toISOString()
                }, null, 2));
              }).listen(3000, '0.0.0.0', () => console.log('API running on :3000'));
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: lab3-1
spec:
  selector:
    app: api
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
