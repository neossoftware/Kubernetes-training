server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain application/javascript text/css application/json;

    # Proxy hacia la API — el browser llama a /api/... (mismo origen)
    # En Docker Compose el nombre del servicio es "api" (definido en docker-compose.yml)
    # En Kubernetes se cambia a "api-svc" (nombre del Service ClusterIP)
    location /api/ {
        proxy_pass         http://api:3000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # SPA routing — todas las rutas van a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para assets estáticos
    location ~* \.(js|css|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}