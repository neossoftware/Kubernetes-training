services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: lab1-api
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    networks:
      - lab1-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/hello"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    container_name: lab1-frontend
    ports:
      - "80:80"
    networks:
      - lab1-net
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  lab1-net:
    driver: bridge