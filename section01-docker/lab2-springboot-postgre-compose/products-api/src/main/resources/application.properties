spring.application.name=products-api

# DataSource — valores leídos de variables de entorno (definidas en docker-compose)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:labdb}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:ninja123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Datos iniciales — ejecuta data.sql después de que Hibernate crea las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
